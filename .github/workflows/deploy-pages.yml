name: Deploy to GitHub Pages

# Publishes the built game to GitHub Pages so it can be tested as a website on any
# device. One-time setup: repo Settings -> Pages -> "Build and deployment" -> Source
# = "GitHub Actions". After that, every push to this branch auto-deploys to
# https://<owner>.github.io/outbreak/

on:
  push:
    branches: ["claude/wizardly-cray-UGv1J", "main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
